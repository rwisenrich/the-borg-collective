[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borg-collective"
version = "1.0.0"
description = "Open volunteer-powered collective AI research runtime"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<48"]

[project.scripts]
borg = "borg.__main__:main"

[tool.setuptools.packages.find]
include = ["borg*"]
